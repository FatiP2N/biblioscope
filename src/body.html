<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Biblio<span>scope</span></h1>
      <div class="tabs" id="tabs" role="tablist" data-i18n-aria="aria.tabs">
        <button type="button" role="tab" id="tabLive" aria-selected="true" data-i18n="tab.live"></button>
        <button type="button" role="tab" id="tabPat" aria-selected="false" data-i18n="tab.pat"></button>
        <button type="button" role="tab" id="tabWb" aria-selected="false" data-i18n="tab.wb"></button>
        <button type="button" role="tab" id="tabFile" aria-selected="false" data-i18n="tab.file"></button>
        <button type="button" role="tab" id="tabAbout" aria-selected="false" data-i18n="tab.about"></button>
      </div>
      <span class="spacer"></span>
      <div class="lang" role="group" data-i18n-aria="aria.lang">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="ghost" id="btnSettings" type="button" aria-expanded="false" data-i18n="btn.settings"></button>
    </div>

    <div id="liveControls">
      <form class="query" id="qform" autocomplete="off">
        <div class="field q">
          <label for="q" data-i18n="f.subject"></label>
          <input id="q" data-i18n-ph="ph.subject">
        </div>
        <div class="field c">
          <label for="cInput" data-i18n="f.country"></label>
          <div class="chips" id="chips"><input id="cInput" list="countryList" data-i18n-ph="ph.country"></div>
        </div>
        <div class="field">
          <label for="y1" data-i18n="f.period"></label>
          <div class="years"><input id="y1" type="number" min="1900" max="2100" value="2005" data-i18n-aria="aria.y1"><span>–</span><input id="y2" type="number" min="1900" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <div class="field">
          <label for="type" data-i18n="f.type"></label>
          <select id="type">
            <option value="" data-i18n="type.all"></option>
            <option value="article" data-i18n="type.article"></option>
            <option value="review" data-i18n="type.review"></option>
            <option value="book-chapter" data-i18n="type.chapter"></option>
            <option value="preprint" data-i18n="type.preprint"></option>
            <option value="dataset" data-i18n="type.dataset"></option>
          </select>
        </div>
        <label class="chk"><input type="checkbox" id="oaOnly"> <span data-i18n="f.oaOnly"></span></label>
        <button class="go" id="go" type="submit" data-i18n="btn.analyze"></button>
      </form>
      <div class="compare" style="margin-top:8px">
        <span class="lbl" data-i18n="cmp.label"></span>
        <input id="q2" data-i18n-ph="ph.q2" data-i18n-aria="ph.q2">
        <input id="c2" list="countryList" data-i18n-ph="ph.c2" data-i18n-aria="ph.c2">
        <span class="note" data-i18n="cmp.note"></span>
      </div>
    </div>

    <div id="patControls" hidden>
      <form class="query pq" id="pform" autocomplete="off">
        <div class="field q">
          <label for="pq" data-i18n="pf.keywords"></label>
          <input id="pq" data-i18n-ph="ph.pq">
        </div>
        <div class="field">
          <label for="pcls" data-i18n="pf.cls"></label>
          <div class="clsrow">
            <select id="pclsType" data-i18n-aria="aria.clsType"><option value="cpc">CPC</option><option value="ipc" data-i18n="opt.ipc"></option></select>
            <input id="pcls" list="clsList" data-i18n-ph="ph.pcls">
          </div>
        </div>
        <div class="field">
          <label for="pap" data-i18n="pf.applicant"></label>
          <input id="pap" data-i18n-ph="ph.applicant">
        </div>
        <div class="field c">
          <label for="pcInput" data-i18n="pf.country"></label>
          <div class="chips" id="pchips"><input id="pcInput" list="officeList" data-i18n-ph="ph.juris"></div>
        </div>
        <div class="field">
          <label for="py1" data-i18n="pf.years"></label>
          <div class="years"><input id="py1" type="number" min="1900" max="2100" value="2005" data-i18n-aria="aria.y1"><span>–</span><input id="py2" type="number" min="1900" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <button class="go" id="pgo" type="submit" data-i18n="btn.analyze"></button>
      </form>
      <div class="pimp">
        <button class="ghost" type="button" id="pSample" data-i18n="pimp.sample"></button>
        <button class="ghost" type="button" id="pLive" hidden data-i18n="pimp.live"></button>
      </div>
    </div>

    <div id="wbControls" hidden>
      <form class="query wq" id="wform" autocomplete="off">
        <div class="field q">
          <label for="wind" data-i18n="wf.indicator"></label>
          <select id="wind"></select>
          <input id="wcode" hidden data-i18n-ph="ph.wcode" data-i18n-aria="wf.code">
        </div>
        <div class="field c">
          <label for="wcInput" data-i18n="wf.countries"></label>
          <div class="chips" id="wchips"><input id="wcInput" list="countryList" data-i18n-ph="ph.country"></div>
        </div>
        <div class="field">
          <label for="wy1" data-i18n="wf.years"></label>
          <div class="years"><input id="wy1" type="number" min="1960" max="2100" value="2000" data-i18n-aria="aria.y1"><span>–</span><input id="wy2" type="number" min="1960" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <button class="go" id="wgo" type="submit" data-i18n="btn.analyze"></button>
      </form>
    </div>

    <section class="importer" id="importer" hidden>
      <div class="drop" id="drop">
        <strong data-i18n="imp.drop"></strong>
        <label class="go" for="file" data-i18n="imp.choose"></label>
        <input class="sr" type="file" id="file" multiple accept=".csv,.tsv,.txt,.xlsx,.xls">
        <span class="note" data-i18n="imp.note"></span>
      </div>
      <div class="files" id="fileList" hidden></div>
      <div class="howto">
        <div data-i18n-html="howto.pop"></div>
        <div data-i18n-html="howto.scopus"></div>
        <div data-i18n-html="howto.wos"></div>
      </div>
    </section>

    <div class="status" id="statusBar" aria-live="polite">
      <span><i class="dot" id="dot"></i><span id="stateTxt"></span></span>
      <span><span data-i18n="st.updated"></span> <span class="mono" id="updated">—</span></span>
      <span id="autoBox"><span data-i18n="st.auto"></span>
        <select id="auto" data-i18n-aria="st.auto">
          <option value="0" data-i18n="auto.off"></option>
          <option value="5" data-i18n="auto.5"></option>
          <option value="15" data-i18n="auto.15"></option>
          <option value="60" data-i18n="auto.60"></option>
        </select>
      </span>
      <span id="budget"></span>
    </div>
  </div>
  <div class="progress" id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
</header>
<datalist id="countryList"></datalist>
<datalist id="clsList"></datalist>
<datalist id="officeList"></datalist>

<main class="wrap">
  <section class="settings" id="settings" hidden>
    <h2 data-i18n="set.title"></h2>
    <p data-i18n="set.intro"></p>
    <div class="grid2">
      <div class="field">
        <label for="oaKey" data-i18n="set.oaKey"></label>
        <input id="oaKey" type="password" placeholder="openalex.org/settings/api">
      </div>
      <div class="field">
        <label for="workerUrl" data-i18n="set.worker"></label>
        <input id="workerUrl" placeholder="https://biblioscope.your-account.workers.dev">
      </div>
    </div>
    <label class="chk" style="padding:0"><input type="checkbox" id="viaWorker"> <span data-i18n="set.via"></span></label>
    <p data-i18n="set.patents"></p>
    <div class="row">
      <button class="go" type="button" id="saveSettings" data-i18n="btn.save"></button>
      <button class="ghost" type="button" id="testWorker" data-i18n="btn.test"></button>
      <span class="note" id="settingsMsg"></span>
    </div>
  </section>

  <div class="banner err" id="siteBanner" hidden></div>
  <div class="banner" id="demoBanner" hidden data-i18n-html="demo.banner"></div>
  <div class="banner info" id="fileBanner" hidden></div>

  <div id="pubView">
    <p class="scope" id="scope"></p>

    <section class="kpis k5" data-i18n-aria="aria.kpis">
      <div class="kpi"><span class="k" data-i18n="k.pubs"></span><span class="v" id="kPubs">—</span><span class="s" id="kPubsS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.h"></span><span class="v" id="kH">—</span><span class="s" id="kHS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.cit"></span><span class="v" id="kCit">—</span><span class="s" id="kCitS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.oa"></span><span class="v" id="kOA">—</span><span class="s" data-i18n="k.oaS"></span></div>
      <div class="kpi" id="kRankBox"><span class="k" id="kRankK"></span><span class="v" id="kRank">—</span><span class="s" id="kRankS"></span></div>
    </section>

    <div class="grid" id="grid">
      <section class="panel wide" id="mergePanel" hidden>
        <div class="ph"><h2 data-i18n="m.title"></h2><span class="src" id="mergeSrc"></span><span class="sp"></span>
          <button class="ghost" type="button" id="btnDownload" data-i18n="m.download"></button>
          <button class="ghost" type="button" id="btnCopyMerged" data-i18n="m.copy"></button>
        </div>
        <div class="metrics" id="mergeStats"></div>
        <div class="mapbox">
          <div class="scroll"><table id="tFiles"><thead><tr><th data-i18n="m.file"></th><th data-i18n="m.base"></th><th class="n" data-i18n="m.read"></th><th class="n" data-i18n="m.internal"></th><th class="n" data-i18n="m.kept"></th></tr></thead><tbody></tbody></table></div>
          <div class="scroll"><table id="tProv"><thead><tr><th data-i18n="m.prov"></th><th class="n" data-i18n="th.pubs"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody></tbody></table></div>
        </div>
        <p class="note" id="mergeNote"></p>
        <div id="reviewBox" hidden>
          <h3 class="h3" data-i18n="m.reviewTitle"></h3>
          <div class="scroll"><table id="tReview"><thead><tr><th class="n" data-i18n="m.sim"></th><th data-i18n="m.titleA"></th><th data-i18n="m.titleB"></th><th class="n" data-i18n="th.year"></th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <section class="panel wide" id="metricsPanel" hidden>
        <div class="ph"><h2 data-i18n="p.metrics"></h2><span class="src" data-i18n="p.metricsSrc"></span></div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section class="panel wide">
        <div class="ph"><h2 data-i18n="p.years"></h2><span class="src" id="srcYears"></span></div>
        <div class="chart" id="cYears" role="img" data-i18n-aria="p.years"></div>
        <p class="note" id="yearsNote" data-i18n="p.yearsNote"></p>
      </section>

      <section class="panel wide">
        <div class="ph">
          <h2 id="mapTitle"></h2><span class="src" id="mapSrc"></span><span class="sp"></span>
          <span class="seg" id="mapSeg" hidden>
            <button class="ghost" type="button" data-view="world" aria-pressed="true" data-i18n="seg.world"></button>
            <button class="ghost" type="button" data-view="partners" aria-pressed="false" data-i18n="seg.partners"></button>
          </span>
          <button class="ghost" type="button" data-copy="countries" data-i18n="btn.copy"></button>
        </div>
        <div class="mapbox">
          <div class="map" id="cMap" role="img" data-i18n-aria="aria.map"></div>
          <div class="scroll"><table id="tCountries"><thead><tr><th>#</th><th data-i18n="th.country"></th><th class="n" data-i18n="th.pubs"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody></tbody></table></div>
        </div>
        <p class="note" id="mapNote"></p>
      </section>

      <section class="panel wide" id="pubNetPanel">
        <div class="ph"><h2 data-i18n="net.title"></h2><span class="src" id="pubNetStats"></span><span class="sp"></span>
          <button class="ghost" type="button" id="pubNetCopy" data-i18n="net.copy"></button></div>
        <div class="netctl">
          <label><span data-i18n="net.type"></span> <select id="pubNetType"></select></label>
          <label><span data-i18n="net.size"></span> <select id="pubNetSize"><option value="30">30</option><option value="60" selected>60</option><option value="100">100</option><option value="150">150</option></select></label>
          <span class="seg" id="pubNetColor"><button class="ghost" type="button" data-color="cluster" aria-pressed="true" data-i18n="net.clusters"></button><button class="ghost" type="button" data-color="year" aria-pressed="false" data-i18n="net.year"></button></span>
        </div>
        <div class="net" id="pubcNet" role="img" data-i18n-aria="net.title"></div>
        <div class="netlegend" id="pubNetLegend"></div>
        <p class="note" id="pubNetNote"></p>
      </section>

      <section class="panel" id="instPanel">
        <div class="ph"><h2 data-i18n="p.inst"></h2><span class="src">OpenAlex</span></div>
        <div class="chart tall" id="cInst" role="img" data-i18n-aria="p.inst"></div>
        <p class="note" id="instNote" data-i18n="p.instNote"></p>
      </section>

      <section class="panel" id="fieldsPanel">
        <div class="ph"><h2 data-i18n="p.fields"></h2><span class="src" data-i18n="p.fieldsSrc"></span></div>
        <div class="chart tall" id="cFields" role="img" data-i18n-aria="p.fields"></div>
      </section>

      <section class="panel">
        <div class="ph"><h2 data-i18n="p.sources"></h2><span class="src" id="srcSources"></span></div>
        <div class="scroll"><table id="tSources"><thead><tr><th>#</th><th data-i18n="th.source"></th><th class="n" data-i18n="th.pubs"></th></tr></thead><tbody></tbody></table></div>
      </section>

      <section class="panel">
        <div class="ph"><h2 data-i18n="p.oa"></h2><span class="src" id="srcOA">OpenAlex · Unpaywall</span></div>
        <div id="oaBox"></div>
        <p class="note" data-i18n="p.oaNote"></p>
      </section>

      <section class="panel wide">
        <div class="ph"><h2 data-i18n="p.works"></h2><span class="src" id="srcWorks"></span><span class="sp"></span><button class="ghost" type="button" data-copy="works" data-i18n="btn.copy"></button></div>
        <div class="scroll"><table id="tWorks"><thead><tr><th>#</th><th data-i18n="th.pub"></th><th class="n" data-i18n="th.year"></th><th class="n" data-i18n="th.cites"></th></tr></thead><tbody></tbody></table></div>
      </section>
    </div>
  </div>

  <div id="patView" hidden>
    <div class="banner" id="pDemoBanner" hidden data-i18n-html="pdemo.banner"></div>
    <section class="setup" id="pSetup" hidden>
      <h2 data-i18n="setup.title"></h2>
      <div data-i18n-html="setup.list"></div>
      <p class="note" data-i18n="setup.note"></p>
    </section>

    <p class="scope" id="pscope"></p>
    <section class="kpis" data-i18n-aria="aria.pkpis">
      <div class="kpi pat"><span class="k" data-i18n="pk.tot"></span><span class="v" id="pTot">—</span><span class="s" id="pTotS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.growth"></span><span class="v" id="pGrowth">—</span><span class="s" id="pGrowthS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.ctry"></span><span class="v" id="pCtry">—</span><span class="s" id="pCtryS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.off"></span><span class="v" id="pOff">—</span><span class="s" id="pOffS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.top"></span><span class="v small" id="pTopApp">—</span><span class="s" id="pTopAppS"></span></div>
      <div class="kpi"><span class="k" id="pActiveK" data-i18n="pk.active"></span><span class="v" id="pActive">—</span><span class="s" id="pActiveS"></span></div>
    </section>

    <div class="grid" id="pgrid">
      <section id="pYearsPanel" class="panel wide">
        <div class="ph"><h2 data-i18n="pp.years"></h2><span class="src" id="pSrc1"></span></div>
        <div class="chart" id="cPYears" role="img" data-i18n-aria="pp.years"></div>
        <p class="note" data-i18n="pp.yearsNote"></p>
      </section>

      <section id="pMapPanel" class="panel wide">
        <div class="ph">
          <h2 id="pMapTitle"></h2><span class="src" id="pSrc2"></span><span class="sp"></span>
          <span class="seg" id="pMapSeg">
            <button class="ghost" type="button" data-pview="applicant" aria-pressed="true" data-i18n="pseg.applicant"></button>
            <button class="ghost" type="button" data-pview="origin" aria-pressed="false" data-i18n="pseg.origin"></button>
            <button class="ghost" type="button" data-pview="protection" aria-pressed="false" data-i18n="pseg.protection"></button>
            <button class="ghost" type="button" data-pview="office" aria-pressed="false" data-i18n="pseg.office"></button>
          </span>
          <button class="ghost" type="button" data-copy="pcountries" data-i18n="btn.copy"></button>
        </div>
        <div class="mapbox">
          <div class="map" id="cPMap" role="img" data-i18n-aria="aria.pmap"></div>
          <div class="scroll"><table id="tPCountries"><thead><tr><th>#</th><th id="pColName"></th><th class="n" data-i18n="th.patents"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody class="click"></tbody></table></div>
        </div>
        <p class="note" id="pMapNote"></p>
      </section>

      <section class="panel wide" id="patNetPanel">
        <div class="ph"><h2 data-i18n="net.titlePat"></h2><span class="src" id="patNetStats"></span><span class="sp"></span>
          <button class="ghost" type="button" id="patNetCopy" data-i18n="net.copy"></button></div>
        <div class="netctl">
          <label><span data-i18n="net.type"></span> <select id="patNetType"></select></label>
          <label><span data-i18n="net.size"></span> <select id="patNetSize"><option value="30">30</option><option value="60" selected>60</option><option value="100">100</option><option value="150">150</option></select></label>
          <span class="seg" id="patNetColor"><button class="ghost" type="button" data-color="cluster" aria-pressed="true" data-i18n="net.clusters"></button><button class="ghost" type="button" data-color="year" aria-pressed="false" data-i18n="net.year"></button></span>
        </div>
        <div class="net" id="patcNet" role="img" data-i18n-aria="net.titlePat"></div>
        <div class="netlegend" id="patNetLegend"></div>
        <p class="note" id="patNetNote"></p>
      </section>

      <section id="pCodesPanel" class="panel">
        <div class="ph"><h2 id="pCodesTitle"></h2><span class="sp"></span>
          <span class="seg" id="pLevelSeg">
            <button class="ghost" type="button" data-level="subclass" aria-pressed="true" data-i18n="lvl.subclass"></button>
            <button class="ghost" type="button" data-level="group" aria-pressed="false" data-i18n="lvl.group"></button>
            <button class="ghost" type="button" data-level="full" aria-pressed="false" data-i18n="lvl.full"></button>
          </span>
        </div>
        <div class="chart tall" id="cPCodes" role="img" data-i18n-aria="aria.codes"></div>
        <p class="note" data-i18n="pp.codesNote"></p>
      </section>

      <section id="pAppPanel" class="panel">
        <div class="ph"><h2 data-i18n="pp.applicants"></h2><span class="src" id="pSrc3"></span></div>
        <div class="scroll"><table id="tPApplicants"><thead><tr><th>#</th><th data-i18n="th.applicant"></th><th class="n" data-i18n="th.patents"></th></tr></thead><tbody></tbody></table></div>
      </section>

      <section class="panel" id="officesPanel">
        <div class="ph"><h2 data-i18n="pp.offices"></h2></div>
        <div class="chart" id="cPOffice" role="img" data-i18n-aria="pp.offices"></div>
      </section>

      <section class="panel" id="legalPanel">
        <div class="ph"><h2 data-i18n="pp.legal"></h2></div>
        <div class="chart" id="cPLegal" role="img" data-i18n-aria="pp.legal"></div>
      </section>

      <section id="pTopPanel" class="panel wide">
        <div class="ph"><h2 id="pTopTitle"></h2><span class="src" id="pTopSrc"></span></div>
        <div class="scroll"><table id="tPTop"><thead><tr><th>#</th><th data-i18n="th.patent"></th><th data-i18n="th.number"></th><th class="n" data-i18n="th.published"></th><th class="n" id="pTopCol"></th></tr></thead><tbody></tbody></table></div>
      </section>
    </div>
  </div>
  <div id="wbView" hidden>
    <p class="scope" id="wscope"></p>
    <section class="kpis k4" data-i18n-aria="tab.wb">
      <div class="kpi"><span class="k" id="wK1k" data-i18n="wk.latest"></span><span class="v" id="wK1">—</span><span class="s" id="wK1s"></span></div>
      <div class="kpi"><span class="k" data-i18n="wk.rank"></span><span class="v" id="wK2">—</span><span class="s" id="wK2s"></span></div>
      <div class="kpi"><span class="k" data-i18n="wk.change"></span><span class="v" id="wK3">—</span><span class="s" id="wK3s"></span></div>
      <div class="kpi"><span class="k" data-i18n="wk.world"></span><span class="v" id="wK4">—</span><span class="s" id="wK4s"></span></div>
    </section>
    <div class="grid" id="wgrid">
      <section id="wTrendPanel" class="panel wide">
        <div class="ph"><h2 data-i18n="wp.trend"></h2><span class="src" data-i18n="w.src"></span><span class="sp"></span>
          <button class="ghost" type="button" id="wDlSeries" data-i18n="wbtn.csv"></button></div>
        <div class="chart" id="cWTrend" role="img" data-i18n-aria="wp.trend"></div>
        <p class="note" id="wUnitNote"></p>
      </section>
