<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Intelligentrix · Plateforme de bibliométrie et d’analyse des brevets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tableau de bord bibliométrique en direct : publications, citations, pays, institutions et brevets à partir d'API ouvertes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@500;600;700&display=swap">
<style>
/* Layout: sticky query bar (tabs), indicator strip, then a grid of panels (2 columns, 1 on mobile). */
:root{
  --paper:#F2F5F6; --surface:#FFFFFF; --ink:#13222B; --muted:#5B6C75; --line:#D6DFE3;
  --accent:#1C6E8C; --accent-2:#0E4A61; --accent-soft:#D5E8EF; --ochre:#B4741C; --ochre-soft:#F3E3C8; --wb:#2F7D5B; --wb-soft:#D5EADF;
  --good:#2E7D55; --bad:#B23A48;
  --f-display:"Spectral", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0D161B; --surface:#14212A; --ink:#E2EBEE; --muted:#93A6AF; --line:#24363F;
  --accent:#5CB2D2; --accent-2:#9AD3E8; --accent-soft:#18394A; --ochre:#E2A84C; --ochre-soft:#3F2F17; --wb:#6CC196; --wb-soft:#1B3A2C;
  --good:#5FBF8C; --bad:#E07A86; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0D161B; --surface:#14212A; --ink:#E2EBEE; --muted:#93A6AF; --line:#24363F;
  --accent:#5CB2D2; --accent-2:#9AD3E8; --accent-soft:#18394A; --ochre:#E2A84C; --ochre-soft:#3F2F17; --wb:#6CC196; --wb-soft:#1B3A2C;
  --good:#5FBF8C; --bad:#E07A86; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{padding-block:12px;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--accent)}
.logo{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.logo .tagline{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:500}
.tabs{display:flex;flex-wrap:wrap;max-width:100%;min-width:0;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.tabs button{background:none;border:0;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.brand .spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer;color:var(--ink)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

form.query{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1.7fr) auto auto auto auto;gap:8px;align-items:end}
.compare{display:grid;grid-template-columns:auto minmax(0,1.7fr) minmax(0,1.2fr) minmax(0,1fr);gap:8px;align-items:center}
.compare .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.compare .note{font-size:.75rem}
.field{display:grid;gap:3px;min-width:0}
.field label,.flabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.inp,.field input,.field select,.compare input{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0;width:100%}
.field input:focus,.field select:focus,.compare input:focus{border-color:var(--accent);outline:none}
.years{display:flex;gap:4px;align-items:center}
.years input{width:5.2em}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;white-space:nowrap;padding-bottom:9px}
.go{background:var(--accent);color:var(--surface);border:0;border-radius:var(--r);padding:9px 18px;font-weight:600;cursor:pointer;display:inline-block}
.go:hover{background:var(--accent-2)}
.go:disabled{opacity:.6;cursor:progress}

/* Country selector (chips) */
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px;min-height:40px}
.chips:focus-within{border-color:var(--accent)}
.chips input{border:0!important;background:transparent!important;padding:4px!important;flex:1;min-width:8em;width:auto!important}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--ochre-soft);color:var(--ink);border:1px solid var(--ochre);border-radius:999px;padding:1px 4px 1px 9px;font-size:.8rem;white-space:nowrap}
.chip button{background:none;border:0;cursor:pointer;color:var(--ochre);font-size:1rem;line-height:1;padding:0 3px}
form.query.pq{grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) minmax(0,1.4fr) auto auto}
form.query.wq{grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) auto auto}
form.query.wq select,form.query.wq #wcode{width:100%}
#wcode{margin-top:6px}
.clsrow{display:flex;gap:4px}.clsrow select{width:auto;flex:none}
@media (max-width:980px){form.query,form.query.pq,form.query.wq{grid-template-columns:1fr 1fr}.field.q,.field.c{grid-column:1/-1}.go{grid-column:1/-1}
  .compare{grid-template-columns:1fr 1fr}.compare .lbl,.compare .note{grid-column:1/-1}}

.status{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.8rem;color:var(--muted)}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.status .dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.status .dot.demo{background:var(--ochre)}
.status .dot.err{background:var(--bad)}
.status select{background:transparent;border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:.8rem}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* Import */
.importer{display:grid;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--f-display);font-size:1.05rem}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.howto div{font-size:.8rem;color:var(--muted);min-width:0}
.howto b{display:block;color:var(--ink);font-size:.85rem;margin-bottom:2px}
.howto ol{margin:0;padding-left:1.2em}
@media (max-width:780px){.howto{grid-template-columns:1fr}}

.banner{border:1px solid var(--ochre);background:var(--ochre-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.88rem;margin-top:16px}
.banner strong{color:var(--ochre)}
.banner.info{border-color:var(--accent);background:var(--accent-soft)}
.banner.info strong{color:var(--accent-2)}
.setup{background:var(--surface);border:1px solid var(--ochre);border-radius:var(--r);padding:16px;margin-top:16px;display:grid;gap:8px}
.setup h2{font-family:var(--f-display);font-size:1.1rem;margin:0}
.setup ol{margin:0;padding-left:1.3em;font-size:.88rem;display:grid;gap:3px;max-width:90ch}
.setup code{font-family:var(--f-data);font-size:.8rem;background:var(--paper);padding:1px 5px;border-radius:3px}
.seg button[disabled]{opacity:.45;cursor:not-allowed}

/* Settings */
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px;display:grid;gap:12px}
.settings h2{font-family:var(--f-display);margin:0;font-size:1.15rem}
.settings .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.settings .grid2{grid-template-columns:1fr}}
.settings p{margin:0;color:var(--muted);font-size:.85rem;max-width:75ch}
.settings .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Indicators */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:18px}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px;min-width:0;align-content:start}
.kpi .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v sup{font-size:.55em}
.kpi .s{font-size:.75rem;color:var(--muted)}
.kpi.pat .v,.kpi.is-rank .v{color:var(--ochre)}
.kpi .v.small{font-size:1.02rem;line-height:1.3;font-family:var(--f-body);font-weight:600;overflow-wrap:anywhere}
.kpi.link{cursor:pointer}
.kpi.link:hover .k{color:var(--accent)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.scope{margin:16px 0 0;font-family:var(--f-display);font-size:1.15rem;font-weight:500;color:var(--muted)}
.scope b{color:var(--ink);font-weight:600}

/* Panels */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-block:16px 40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:10px;align-content:start}
.panel.wide{grid-column:1/-1}
.panel>*{min-width:0}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph h2{font-family:var(--f-display);font-weight:600;font-size:1.2rem;margin:0;text-wrap:balance}
.ph .src{font-size:.72rem;color:var(--muted);font-family:var(--f-data)}
.ph .sp{flex:1}
.ph button{font-size:.78rem;padding:3px 9px}
.seg{display:inline-flex;gap:4px}
.note{font-size:.8rem;color:var(--muted);margin:0}
.chart{width:100%;height:320px}
.chart.tall{height:420px}
.mapbox{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.mapbox{grid-template-columns:minmax(0,1fr)}}
.map{height:430px}
.na{display:grid;place-items:center;min-height:140px;color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:var(--r);text-align:center;padding:16px}

table{border-collapse:collapse;width:100%;font-size:.85rem}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody.click tr{cursor:pointer}
tbody.click tr:hover td{background:var(--paper)}
tr.sel td{background:var(--ochre-soft)}
tr.sel td:nth-child(2){font-weight:600}
.scroll{overflow-x:auto;max-height:430px;overflow-y:auto}
.bar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent)}
tr.sel .bar i{background:var(--ochre)}
.rank{color:var(--muted);font-family:var(--f-data);width:2.2em}
.w-title{max-width:52ch}
.w-meta{color:var(--muted);font-size:.78rem}
.pill{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px;white-space:nowrap}
.pill.oa{border-color:var(--good);color:var(--good)}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.metrics div{background:var(--surface);padding:10px 12px;display:grid;gap:1px}
.metrics .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.metrics .v{font-family:var(--f-data);font-size:1.15rem;font-variant-numeric:tabular-nums}
.metrics .s{font-size:.72rem;color:var(--muted)}

.oabar{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.oabar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;color:var(--muted);font-size:.88rem;display:grid;gap:8px}
.empty code{font-family:var(--f-data);font-size:.8rem;background:var(--paper);padding:1px 5px;border-radius:3px}
footer{color:var(--muted);font-size:.8rem;padding-block:0 32px}
footer p{max-width:90ch;margin:.3em 0}
.loading .chart,.loading .scroll{opacity:.45;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Language, imported files, merge */
.lang{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lang button{background:none;border:0;padding:5px 9px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);font-family:var(--f-data)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:.8rem;max-width:100%;min-width:0;overflow-wrap:anywhere}
.fchip b{color:var(--accent);font-family:var(--f-data);font-size:.72rem}
.fchip button{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:0 4px}
.files .ghost{font-size:.78rem;padding:3px 9px}
.h3{font-family:var(--f-display);font-weight:600;font-size:1rem;margin:4px 0}
#mergeStats .v{font-size:1.4rem}
@media (max-width:640px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Networks, patent sample, About page */
:root{--c1:#1C6E8C;--c2:#C2702A;--c3:#2E7D55;--c4:#B23A48;--c5:#6A4FA3;--c6:#2A8F8F;--c7:#8C7A1C;--c8:#5B6C75}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#5CB2D2;--c2:#E39A55;--c3:#5FBF8C;--c4:#E07A86;--c5:#A58BE0;--c6:#5CC7C7;--c7:#D2BE5A;--c8:#93A6AF}}
:root[data-theme="dark"]{--c1:#5CB2D2;--c2:#E39A55;--c3:#5FBF8C;--c4:#E07A86;--c5:#A58BE0;--c6:#5CC7C7;--c7:#D2BE5A;--c8:#93A6AF}
.netctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.82rem;color:var(--muted)}
.netctl label{display:flex;align-items:center;gap:6px}
.netctl select{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:4px 6px;color:var(--ink);max-width:100%}
.net{width:100%;height:560px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
@media (max-width:640px){.net{height:420px}}
.netlegend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.8rem}
.netlegend .ramp{display:inline-block;width:160px;max-width:40vw;height:10px;border-radius:5px}
.pimp{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pimp .ghost{font-size:.8rem;padding:4px 10px;cursor:pointer}
.about{max-width:78ch;margin:24px auto 48px;display:grid;gap:14px}
.about h2{font-family:var(--f-display);font-size:1.9rem;margin:0;text-wrap:balance}
.about .lead{font-size:1.08rem;color:var(--muted);margin:0}
.about h3{font-family:var(--f-display);font-size:1.25rem;margin:22px 0 6px;color:var(--accent-2)}
.about p,.about li,.about dd{line-height:1.6}
.about ul,.about ol{padding-left:1.3em;display:grid;gap:4px}
.about dl{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:6px 16px;margin:0}
.about dt{font-weight:600}.about dd{margin:0}
@media (max-width:560px){.about dl{grid-template-columns:minmax(0,1fr)}.about dd{margin-bottom:6px}}
.about code{font-family:var(--f-data);font-size:.85em;background:var(--surface);border:1px solid var(--line);padding:0 4px;border-radius:3px}
.about section{scroll-margin-top:140px}
.toc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-block:1px solid var(--line)}
.toc .ghost{font-size:.8rem;padding:3px 9px}
.banner.err{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.banner.err strong{color:var(--bad)}
.banner .go{margin-left:6px;padding:4px 12px;font-size:.85rem}
.banner .note{display:inline}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
#wbView .kpi .v{color:var(--wb)}
#tWRank tr.sel td{background:var(--wb-soft)}
.ph .chk{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);padding:0;cursor:pointer}
.wb-chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0 18px}.wb-chart .wbc-src{margin:6px 0 0}.wb-chart .na{padding:24px 0}
.w-about{font-size:13.5px;line-height:1.55;color:var(--ink)}.w-about p{margin:0 0 8px;max-width:90ch}.w-about .mono{font-size:12px}
@media (max-width:900px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Loading indicators */
.top{position:sticky}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden;background:var(--accent-soft)}
.progress i{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--accent);transition:width .35s ease}
.progress.indet i{width:28%;animation:bs-indet 1.3s ease-in-out infinite}
@keyframes bs-indet{0%{left:-28%}100%{left:100%}}
.panel{position:relative}
.panel.busy .ph{padding-right:150px}
.panel.busy::after{content:"";position:absolute;top:18px;right:16px;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:bs-spin .8s linear infinite}
.panel.busy::before{content:attr(data-busy);position:absolute;top:16px;right:38px;font-size:.74rem;color:var(--muted);font-family:var(--f-data);white-space:nowrap}
.panel.busy .chart,.panel.busy .map,.panel.busy .net,.panel.busy .scroll{opacity:.55;transition:opacity .2s}
@keyframes bs-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.progress.indet i{animation:none;width:100%;opacity:.5}.panel.busy::after{animation:none}}
/* Custom pages (pages/ folder) */
.custom h1{font-family:var(--f-display);font-size:1.9rem;margin:0;text-wrap:balance}
.custom h2{font-family:var(--f-display);font-size:1.35rem;margin:22px 0 6px;color:var(--accent-2)}
.custom img,.custom video,.custom iframe,.custom embed,.custom object{max-width:100%}
.custom iframe{border:0;border-radius:var(--r);background:var(--surface)}
.custom table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.custom th,.custom td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.custom blockquote{margin:0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:4px}
.custom pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:var(--r)}
.custom hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.embed{position:relative;width:100%;aspect-ratio:16/9;max-width:100%}
.embed iframe{position:absolute;inset:0;width:100%;height:100%}
.byline{display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><h1 id="siteName">Intelligen<span>trix</span></h1><span class="tagline" id="siteTagline" data-i18n="site.tagline"></span></div>
      <div class="tabs" id="tabs" role="tablist" data-i18n-aria="aria.tabs">
        <button type="button" role="tab" id="tabLive" aria-selected="true" data-i18n="tab.live"></button>
        <button type="button" role="tab" id="tabPat" aria-selected="false" data-i18n="tab.pat"></button>
        <button type="button" role="tab" id="tabWb" aria-selected="false" data-i18n="tab.wb"></button>
        <button type="button" role="tab" id="tabFile" aria-selected="false" data-i18n="tab.file"></button>
        <button type="button" role="tab" id="tabAbout" aria-selected="false" data-i18n="tab.about"></button>
      </div>
      <span class="spacer"></span>
      <div class="lang" role="group" data-i18n-aria="aria.lang">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="ghost" id="btnSettings" type="button" aria-expanded="false" data-i18n="btn.settings"></button>
    </div>

    <div id="liveControls">
      <form class="query" id="qform" autocomplete="off">
        <div class="field q">
          <label for="q" data-i18n="f.subject"></label>
          <input id="q" data-i18n-ph="ph.subject">
        </div>
        <div class="field c">
          <label for="cInput" data-i18n="f.country"></label>
          <div class="chips" id="chips"><input id="cInput" list="countryList" data-i18n-ph="ph.country"></div>
        </div>
        <div class="field">
          <label for="y1" data-i18n="f.period"></label>
          <div class="years"><input id="y1" type="number" min="1900" max="2100" value="2005" data-i18n-aria="aria.y1"><span>–</span><input id="y2" type="number" min="1900" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <div class="field">
          <label for="type" data-i18n="f.type"></label>
          <select id="type">
            <option value="" data-i18n="type.all"></option>
            <option value="article" data-i18n="type.article"></option>
            <option value="review" data-i18n="type.review"></option>
            <option value="book-chapter" data-i18n="type.chapter"></option>
            <option value="preprint" data-i18n="type.preprint"></option>
            <option value="dataset" data-i18n="type.dataset"></option>
          </select>
        </div>
        <label class="chk"><input type="checkbox" id="oaOnly"> <span data-i18n="f.oaOnly"></span></label>
        <button class="go" id="go" type="submit" data-i18n="btn.analyze"></button>
      </form>
      <div class="compare" style="margin-top:8px">
        <span class="lbl" data-i18n="cmp.label"></span>
        <input id="q2" data-i18n-ph="ph.q2" data-i18n-aria="ph.q2">
        <input id="c2" list="countryList" data-i18n-ph="ph.c2" data-i18n-aria="ph.c2">
        <span class="note" data-i18n="cmp.note"></span>
      </div>
    </div>

    <div id="patControls" hidden>
      <form class="query pq" id="pform" autocomplete="off">
        <div class="field q">
          <label for="pq" data-i18n="pf.keywords"></label>
          <input id="pq" data-i18n-ph="ph.pq">
        </div>
        <div class="field">
          <label for="pcls" data-i18n="pf.cls"></label>
          <div class="clsrow">
            <select id="pclsType" data-i18n-aria="aria.clsType"><option value="cpc">CPC</option><option value="ipc" data-i18n="opt.ipc"></option></select>
            <input id="pcls" list="clsList" data-i18n-ph="ph.pcls">
          </div>
        </div>
        <div class="field">
          <label for="pap" data-i18n="pf.applicant"></label>
          <input id="pap" data-i18n-ph="ph.applicant">
        </div>
        <div class="field c">
          <label for="pcInput" data-i18n="pf.country"></label>
          <div class="chips" id="pchips"><input id="pcInput" list="officeList" data-i18n-ph="ph.juris"></div>
        </div>
        <div class="field">
          <label for="py1" data-i18n="pf.years"></label>
          <div class="years"><input id="py1" type="number" min="1900" max="2100" value="2005" data-i18n-aria="aria.y1"><span>–</span><input id="py2" type="number" min="1900" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <button class="go" id="pgo" type="submit" data-i18n="btn.analyze"></button>
      </form>
      <div class="pimp">
        <button class="ghost" type="button" id="pSample" data-i18n="pimp.sample"></button>
        <button class="ghost" type="button" id="pLive" hidden data-i18n="pimp.live"></button>
      </div>
    </div>

    <div id="wbControls" hidden>
      <form class="query wq" id="wform" autocomplete="off">
        <div class="field q">
          <label for="wind" data-i18n="wf.indicator"></label>
          <select id="wind"></select>
          <input id="wcode" hidden data-i18n-ph="ph.wcode" data-i18n-aria="wf.code">
        </div>
        <div class="field c">
          <label for="wcInput" data-i18n="wf.countries"></label>
          <div class="chips" id="wchips"><input id="wcInput" list="countryList" data-i18n-ph="ph.country"></div>
        </div>
        <div class="field">
          <label for="wy1" data-i18n="wf.years"></label>
          <div class="years"><input id="wy1" type="number" min="1960" max="2100" value="2000" data-i18n-aria="aria.y1"><span>–</span><input id="wy2" type="number" min="1960" max="2100" data-i18n-aria="aria.y2"></div>
        </div>
        <button class="go" id="wgo" type="submit" data-i18n="btn.analyze"></button>
      </form>
    </div>

    <section class="importer" id="importer" hidden>
      <div class="drop" id="drop">
        <strong data-i18n="imp.drop"></strong>
        <label class="go" for="file" data-i18n="imp.choose"></label>
        <input class="sr" type="file" id="file" multiple accept=".csv,.tsv,.txt,.xlsx,.xls">
        <span class="note" data-i18n="imp.note"></span>
      </div>
      <div class="files" id="fileList" hidden></div>
      <div class="howto">
        <div data-i18n-html="howto.pop"></div>
        <div data-i18n-html="howto.scopus"></div>
        <div data-i18n-html="howto.wos"></div>
      </div>
    </section>

    <div class="status" id="statusBar" aria-live="polite">
      <span><i class="dot" id="dot"></i><span id="stateTxt"></span></span>
      <span><span data-i18n="st.updated"></span> <span class="mono" id="updated">—</span></span>
      <span id="autoBox"><span data-i18n="st.auto"></span>
        <select id="auto" data-i18n-aria="st.auto">
          <option value="0" data-i18n="auto.off"></option>
          <option value="5" data-i18n="auto.5"></option>
          <option value="15" data-i18n="auto.15"></option>
          <option value="60" data-i18n="auto.60"></option>
        </select>
      </span>
      <span id="budget"></span>
    </div>
  </div>
  <div class="progress" id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
</header>
<datalist id="countryList"></datalist>
<datalist id="clsList"></datalist>
<datalist id="officeList"></datalist>

<main class="wrap">
  <section class="settings" id="settings" hidden>
    <h2 data-i18n="set.title"></h2>
    <p data-i18n="set.intro"></p>
    <div class="grid2">
      <div class="field">
        <label for="oaKey" data-i18n="set.oaKey"></label>
        <input id="oaKey" type="password" placeholder="openalex.org/settings/api">
      </div>
      <div class="field">
        <label for="workerUrl" data-i18n="set.worker"></label>
        <input id="workerUrl" placeholder="https://biblioscope.your-account.workers.dev">
      </div>
    </div>
    <label class="chk" style="padding:0"><input type="checkbox" id="viaWorker"> <span data-i18n="set.via"></span></label>
    <p data-i18n="set.patents"></p>
    <div class="row">
      <button class="go" type="button" id="saveSettings" data-i18n="btn.save"></button>
      <button class="ghost" type="button" id="testWorker" data-i18n="btn.test"></button>
      <span class="note" id="settingsMsg"></span>
    </div>
  </section>

  <div class="banner err" id="siteBanner" hidden></div>
  <div class="banner" id="demoBanner" hidden data-i18n-html="demo.banner"></div>
  <div class="banner info" id="fileBanner" hidden></div>

  <div id="pubView">
    <p class="scope" id="scope"></p>

    <section class="kpis k5" data-i18n-aria="aria.kpis">
      <div class="kpi"><span class="k" data-i18n="k.pubs"></span><span class="v" id="kPubs">—</span><span class="s" id="kPubsS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.h"></span><span class="v" id="kH">—</span><span class="s" id="kHS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.cit"></span><span class="v" id="kCit">—</span><span class="s" id="kCitS"></span></div>
      <div class="kpi"><span class="k" data-i18n="k.oa"></span><span class="v" id="kOA">—</span><span class="s" data-i18n="k.oaS"></span></div>
      <div class="kpi" id="kRankBox"><span class="k" id="kRankK"></span><span class="v" id="kRank">—</span><span class="s" id="kRankS"></span></div>
    </section>

    <div class="grid" id="grid">
      <section class="panel wide" id="mergePanel" hidden>
        <div class="ph"><h2 data-i18n="m.title"></h2><span class="src" id="mergeSrc"></span><span class="sp"></span>
          <button class="ghost" type="button" id="btnDownload" data-i18n="m.download"></button>
          <button class="ghost" type="button" id="btnCopyMerged" data-i18n="m.copy"></button>
        </div>
        <div class="metrics" id="mergeStats"></div>
        <div class="mapbox">
          <div class="scroll"><table id="tFiles"><thead><tr><th data-i18n="m.file"></th><th data-i18n="m.base"></th><th class="n" data-i18n="m.read"></th><th class="n" data-i18n="m.internal"></th><th class="n" data-i18n="m.kept"></th></tr></thead><tbody></tbody></table></div>
          <div class="scroll"><table id="tProv"><thead><tr><th data-i18n="m.prov"></th><th class="n" data-i18n="th.pubs"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody></tbody></table></div>
        </div>
        <p class="note" id="mergeNote"></p>
        <div id="reviewBox" hidden>
          <h3 class="h3" data-i18n="m.reviewTitle"></h3>
          <div class="scroll"><table id="tReview"><thead><tr><th class="n" data-i18n="m.sim"></th><th data-i18n="m.titleA"></th><th data-i18n="m.titleB"></th><th class="n" data-i18n="th.year"></th></tr></thead><tbody></tbody></table></div>
        </div>
      </section>

      <section class="panel wide" id="metricsPanel" hidden>
        <div class="ph"><h2 data-i18n="p.metrics"></h2><span class="src" data-i18n="p.metricsSrc"></span></div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section class="panel wide">
        <div class="ph"><h2 data-i18n="p.years"></h2><span class="src" id="srcYears"></span></div>
        <div class="chart" id="cYears" role="img" data-i18n-aria="p.years"></div>
        <p class="note" id="yearsNote" data-i18n="p.yearsNote"></p>
      </section>

      <section class="panel wide">
        <div class="ph">
          <h2 id="mapTitle"></h2><span class="src" id="mapSrc"></span><span class="sp"></span>
          <span class="seg" id="mapSeg" hidden>
            <button class="ghost" type="button" data-view="world" aria-pressed="true" data-i18n="seg.world"></button>
            <button class="ghost" type="button" data-view="partners" aria-pressed="false" data-i18n="seg.partners"></button>
          </span>
          <button class="ghost" type="button" data-copy="countries" data-i18n="btn.copy"></button>
        </div>
        <div class="mapbox">
          <div class="map" id="cMap" role="img" data-i18n-aria="aria.map"></div>
          <div class="scroll"><table id="tCountries"><thead><tr><th>#</th><th data-i18n="th.country"></th><th class="n" data-i18n="th.pubs"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody></tbody></table></div>
        </div>
        <p class="note" id="mapNote"></p>
      </section>

      <section class="panel wide" id="pubNetPanel">
        <div class="ph"><h2 data-i18n="net.title"></h2><span class="src" id="pubNetStats"></span><span class="sp"></span>
          <button class="ghost" type="button" id="pubNetCopy" data-i18n="net.copy"></button></div>
        <div class="netctl">
          <label><span data-i18n="net.type"></span> <select id="pubNetType"></select></label>
          <label><span data-i18n="net.size"></span> <select id="pubNetSize"><option value="30">30</option><option value="60" selected>60</option><option value="100">100</option><option value="150">150</option></select></label>
          <span class="seg" id="pubNetColor"><button class="ghost" type="button" data-color="cluster" aria-pressed="true" data-i18n="net.clusters"></button><button class="ghost" type="button" data-color="year" aria-pressed="false" data-i18n="net.year"></button></span>
        </div>
        <div class="net" id="pubcNet" role="img" data-i18n-aria="net.title"></div>
        <div class="netlegend" id="pubNetLegend"></div>
        <p class="note" id="pubNetNote"></p>
      </section>

      <section class="panel" id="instPanel">
        <div class="ph"><h2 data-i18n="p.inst"></h2><span class="src">OpenAlex</span></div>
        <div class="chart tall" id="cInst" role="img" data-i18n-aria="p.inst"></div>
        <p class="note" id="instNote" data-i18n="p.instNote"></p>
      </section>

      <section class="panel" id="fieldsPanel">
        <div class="ph"><h2 data-i18n="p.fields"></h2><span class="src" data-i18n="p.fieldsSrc"></span></div>
        <div class="chart tall" id="cFields" role="img" data-i18n-aria="p.fields"></div>
      </section>

      <section class="panel">
        <div class="ph"><h2 data-i18n="p.sources"></h2><span class="src" id="srcSources"></span></div>
        <div class="scroll"><table id="tSources"><thead><tr><th>#</th><th data-i18n="th.source"></th><th class="n" data-i18n="th.pubs"></th></tr></thead><tbody></tbody></table></div>
      </section>

      <section class="panel">
        <div class="ph"><h2 data-i18n="p.oa"></h2><span class="src" id="srcOA">OpenAlex · Unpaywall</span></div>
        <div id="oaBox"></div>
        <p class="note" data-i18n="p.oaNote"></p>
      </section>

      <section class="panel wide">
        <div class="ph"><h2 data-i18n="p.works"></h2><span class="src" id="srcWorks"></span><span class="sp"></span><button class="ghost" type="button" data-copy="works" data-i18n="btn.copy"></button></div>
        <div class="scroll"><table id="tWorks"><thead><tr><th>#</th><th data-i18n="th.pub"></th><th class="n" data-i18n="th.year"></th><th class="n" data-i18n="th.cites"></th></tr></thead><tbody></tbody></table></div>
      </section>
    </div>
  </div>

  <div id="patView" hidden>
    <div class="banner" id="pDemoBanner" hidden data-i18n-html="pdemo.banner"></div>
    <section class="setup" id="pSetup" hidden>
      <h2 data-i18n="setup.title"></h2>
      <div data-i18n-html="setup.list"></div>
      <p class="note" data-i18n="setup.note"></p>
    </section>

    <p class="scope" id="pscope"></p>
    <section class="kpis" data-i18n-aria="aria.pkpis">
      <div class="kpi pat"><span class="k" data-i18n="pk.tot"></span><span class="v" id="pTot">—</span><span class="s" id="pTotS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.growth"></span><span class="v" id="pGrowth">—</span><span class="s" id="pGrowthS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.ctry"></span><span class="v" id="pCtry">—</span><span class="s" id="pCtryS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.off"></span><span class="v" id="pOff">—</span><span class="s" id="pOffS"></span></div>
      <div class="kpi"><span class="k" data-i18n="pk.top"></span><span class="v small" id="pTopApp">—</span><span class="s" id="pTopAppS"></span></div>
      <div class="kpi"><span class="k" id="pActiveK" data-i18n="pk.active"></span><span class="v" id="pActive">—</span><span class="s" id="pActiveS"></span></div>
    </section>

    <div class="grid" id="pgrid">
      <section id="pYearsPanel" class="panel wide">
        <div class="ph"><h2 data-i18n="pp.years"></h2><span class="src" id="pSrc1"></span></div>
        <div class="chart" id="cPYears" role="img" data-i18n-aria="pp.years"></div>
        <p class="note" data-i18n="pp.yearsNote"></p>
      </section>

      <section id="pMapPanel" class="panel wide">
        <div class="ph">
          <h2 id="pMapTitle"></h2><span class="src" id="pSrc2"></span><span class="sp"></span>
          <span class="seg" id="pMapSeg">
            <button class="ghost" type="button" data-pview="applicant" aria-pressed="true" data-i18n="pseg.applicant"></button>
            <button class="ghost" type="button" data-pview="origin" aria-pressed="false" data-i18n="pseg.origin"></button>
            <button class="ghost" type="button" data-pview="protection" aria-pressed="false" data-i18n="pseg.protection"></button>
            <button class="ghost" type="button" data-pview="office" aria-pressed="false" data-i18n="pseg.office"></button>
          </span>
          <button class="ghost" type="button" data-copy="pcountries" data-i18n="btn.copy"></button>
        </div>
        <div class="mapbox">
          <div class="map" id="cPMap" role="img" data-i18n-aria="aria.pmap"></div>
          <div class="scroll"><table id="tPCountries"><thead><tr><th>#</th><th id="pColName"></th><th class="n" data-i18n="th.patents"></th><th class="n" data-i18n="th.share"></th></tr></thead><tbody class="click"></tbody></table></div>
        </div>
        <p class="note" id="pMapNote"></p>
      </section>

      <section class="panel wide" id="patNetPanel">
        <div class="ph"><h2 data-i18n="net.titlePat"></h2><span class="src" id="patNetStats"></span><span class="sp"></span>
          <button class="ghost" type="button" id="patNetCopy" data-i18n="net.copy"></button></div>
        <div class="netctl">
          <label><span data-i18n="net.type"></span> <select id="patNetType"></select></label>
          <label><span data-i18n="net.size"></span> <select id="patNetSize"><option value="30">30</option><option value="60" selected>60</option><option value="100">100</option><option value="150">150</option></select></label>
          <span class="seg" id="patNetColor"><button class="ghost" type="button" data-color="cluster" aria-pressed="true" data-i18n="net.clusters"></button><button class="ghost" type="button" data-color="year" aria-pressed="false" data-i18n="net.year"></button></span>
        </div>
        <div class="net" id="patcNet" role="img" data-i18n-aria="net.titlePat"></div>
        <div class="netlegend" id="patNetLegend"></div>
        <p class="note" id="patNetNote"></p>
      </section>

      <section id="pCodesPanel" class="panel">
        <div class="ph"><h2 id="pCodesTitle"></h2><span class="sp"></span>
          <span class="seg" id="pLevelSeg">
            <button class="ghost" type="button" data-level="subclass" aria-pressed="true" data-i18n="lvl.subclass"></button>
            <button class="ghost" type="button" data-level="group" aria-pressed="false" data-i18n="lvl.group"></button>
            <button class="ghost" type="button" data-level="full" aria-pressed="false" data-i18n="lvl.full"></button>
          </span>
        </div>
        <div class="chart tall" id="cPCodes" role="img" data-i18n-aria="aria.codes"></div>
        <p class="note" data-i18n="pp.codesNote"></p>
      </section>

      <section id="pAppPanel" class="panel">
        <div class="ph"><h2 data-i18n="pp.applicants"></h2><span class="src" id="pSrc3"></span></div>
        <div class="scroll"><table id="tPApplicants"><thead><tr><th>#</th><th data-i18n="th.applicant"></th><th class="n" data-i18n="th.patents"></th></tr></thead><tbody></tbody></table></div>
      </section>

      <section class="panel" id="officesPanel">
        <div class="ph"><h2 data-i18n="pp.offices"></h2></div>
        <div class="chart" id="cPOffice" role="img" data-i18n-aria="pp.offices"></div>
      </section>

      <section class="panel" id="legalPanel">
        <div class="ph"><h2 data-i18n="pp.legal"></h2></div>
        <div class="chart" id="cPLegal" role="img" data-i18n-aria="pp.legal"></div>
      </section>

      <section id="pTopPanel" class="panel wide">
        <div class="ph"><h2 id="pTopTitle"></h2><span class="src" id="pTopSrc"></span></div>
        <div class="scroll"><table id="tPTop"><thead><tr><th>#</th><th data-i18n="th.patent"></th><th data-i18n="th.number"></th><th class="n" data-i18n="th.published"></th><th class="n" id="pTopCol"></th></tr></thead><tbody></tbody></table></div>
      </section>
    </div>

  "about.title": "À propos d’Intelligentrix",
  "about.lead": "Intelligentrix est une plateforme gratuite d'analyse bibliométrique et de veille technologique. Elle cartographie la production scientifique et les brevets d'un sujet, d'un pays ou d'un ensemble de fichiers, à partir de bases ouvertes et de vos propres exports.",
  "about.toc": "Sommaire",
  "about.body": "<section id=\"ab-start\"><h3>Démarrer en trois étapes</h3><ol><li>Choisissez un onglet : <b>Recherche en direct</b> (publications OpenAlex), <b>Brevets</b> ou <b>Importer et fusionner</b> (vos exports Web of Science, Scopus, Publish or Perish).</li><li>Saisissez vos critères : un sujet, un ou plusieurs pays, une période, puis <b>Analyser</b>.</li><li>Lisez les indicateurs, la carte, le classement et les réseaux ; copiez les tableaux en CSV pour vos rapports.</li></ol></section>"
   + "<section id=\"ab-live\"><h3>Recherche en direct</h3><p>Les publications viennent d'<b>OpenAlex</b>, une base ouverte de plus de 300 millions de documents. Le sujet est cherché dans les titres et les résumés ; laissez-le vide pour analyser toute la production d'un pays.</p><ul><li><b>Pays</b> : ajoutez un ou plusieurs pays. Un seul pays affiche son <b>rang mondial</b> et sa part de la production mondiale ; le panneau carte bascule entre le classement mondial et les <b>pays partenaires</b> (co-publications).</li><li><b>Comparer avec</b> : un second sujet ou un second pays, tracé sur la courbe annuelle.</li><li><b>Carte</b> : cliquez un pays (ou une ligne du classement) pour ouvrir son profil.</li><li><b>Actualisation automatique</b> : relance l'analyse toutes les 5, 15 ou 60 minutes.</li></ul></section>"
   + "<section id=\"ab-pat\"><h3>Brevets</h3><p>Filtrez par mots-clés, par code <b>CPC</b> ou <b>CIB/IPC</b> (par exemple <code>H10K</code> ou <code>Y02E10/549</code>, plusieurs codes séparés par des virgules), par <b>déposant</b> et par <b>juridiction</b> (office de publication : Maroc, Office européen, OMPI…). Les données viennent de l'OEB en direct ; sans mot-clé, l'onglet affiche tous les brevets publiés l'année la plus récente, et la carte mondiale se remplit au fur et à mesure, car l'OEB limite le nombre de recherches par minute. Les déposants, leurs pays, la classification et les réseaux sont calculés sur les notices des 100 premières familles renvoyées par l'OEB. Le bouton <b>Voir l'échantillon</b> affiche un export Espacenet réel (100 familles sur le dessalement de l'eau de mer). Les comptages OEB portent sur des <b>publications</b> (une invention publiée dans cinq offices compte cinq fois) ; l'échantillon Espacenet est compté en <b>familles</b>. Le statut juridique n'est pas fourni sous forme agrégée par l'OEB : il n'est pas affiché.</p><ul><li><b>Pays de priorité</b> : pays du premier dépôt, qui indique l'origine de l'invention.</li><li><b>Pays de protection</b> : offices où la famille du brevet est publiée.</li><li><b>Office de publication</b> : office qui a publié chaque document.</li><li><b>Classification</b> : regroupement par sous-classe (H10K), groupe (H10K30) ou sous-groupe (H10K30/50) ; cliquez une barre pour filtrer.</li></ul></section>"
   + "<section id=\"ab-wb\"><h3>Banque mondiale</h3><p>L'onglet <b>Banque mondiale</b> interroge en direct l'API gratuite de la Banque mondiale (World Development Indicators). Choisissez un indicateur (dépenses de R-D, chercheurs, brevets, articles scientifiques, exportations de haute technologie, PIB, éducation, énergie, eau…) ou saisissez n'importe quel code de la Banque mondiale, puis les pays à comparer et la période. L'onglet affiche l'évolution par pays avec la valeur mondiale en pointillés, une carte et un classement mondial sur la dernière valeur disponible de chaque pays, et la définition officielle de l'indicateur. Les données se téléchargent en CSV.</p></section>"
   + "<section id=\"ab-import\"><h3>Importer et fusionner</h3><p>Déposez un ou plusieurs exports ; le site reconnaît la base de chaque fichier. Les doublons sont repérés par DOI, puis par titre, année et premier auteur, puis par titre et année quand une notice n'a pas de DOI. Les titres seulement proches sont listés pour vérification, jamais fusionnés d'office. Le corpus fusionné se télécharge en CSV. <b>Vos fichiers ne quittent pas votre navigateur.</b></p><ul><li><b>Web of Science</b> : Export → « Tab delimited file », contenu « Full Record ».</li><li><b>Scopus</b> : tout sélectionner, Exporter → CSV avec les informations de citation, bibliographiques, résumé et mots-clés.</li><li><b>Publish or Perish</b> : enregistrer les résultats en CSV (Google Scholar, Crossref, OpenAlex…).</li></ul></section>"
   + "<section id=\"ab-net\"><h3>Lire les réseaux</h3><p>Les réseaux reprennent les principes de VOSviewer. Chaque <b>nœud</b> est un mot-clé, un pays, un auteur, une institution, un code ou un déposant ; sa taille dépend du nombre de documents. Un <b>lien</b> relie deux éléments qui apparaissent dans les mêmes documents ; son épaisseur dépend du nombre de documents communs. Les <b>couleurs</b> montrent soit des groupes d'éléments fortement liés (méthode de Louvain), soit l'<b>année moyenne</b> des documents, pour repérer les thèmes émergents.</p></section>"
   + "<section id=\"ab-ind\"><h3>Définitions des indicateurs</h3><dl><dt>Indice h</dt><dd>h publications citées au moins h fois chacune.</dd><dt>Indice g</dt><dd>les g publications les plus citées totalisent au moins g² citations.</dd><dt>Quotient m</dt><dd>indice h divisé par le nombre d'années depuis la première publication.</dd><dt>Comptage entier</dt><dd>une publication compte pour chacun des pays de ses auteurs ; la somme des pays dépasse donc le total.</dd><dt>Part mondiale</dt><dd>publications du pays divisées par les publications mondiales dont le pays est connu.</dd><dt>Accès ouvert</dt><dd>or (revue ouverte), hybride (article ouvert dans une revue payante), vert (archive ouverte), bronze (lecture gratuite sans licence), diamant (sans frais de lecture ni de publication).</dd><dt>Famille de brevets</dt><dd>ensemble des publications d'une même invention dans différents offices.</dd></dl></section>"
   + "<section id=\"ab-src\"><h3>Sources et limites</h3><ul><li><b>OpenAlex</b> (licence CC0) : couverture large, mais affiliations et pays parfois manquants ; une clé gratuite augmente le volume de requêtes.</li><li><b>Brevets</b> : OEB Open Patent Services (gratuit après validation du compte) et Lens.org, selon leurs conditions d'utilisation. Seuls des comptages agrégés sont affichés.</li><li><b>Scopus et Web of Science</b> : pas d'API ouverte ; leurs données entrent par vos exports, analysés localement.</li></ul></section>",
  "about.author": "Conception", "about.contact": "Contact",
  "foot.data": "Données bibliographiques : <a href=\"https://openalex.org\" target=\"_blank\" rel=\"noopener\">OpenAlex</a> (licence CC0). Brevets : <a href=\"https://www.epo.org/en/searching-for-patents/data/web-services/ops\" target=\"_blank\" rel=\"noopener\">OEB Open Patent Services</a> et <a href=\"https://www.lens.org\" target=\"_blank\" rel=\"noopener\">The Lens</a>, selon leurs conditions d'utilisation. Imports : <a href=\"https://harzing.com/resources/publish-or-perish\" target=\"_blank\" rel=\"noopener\">Publish or Perish</a>, Scopus, Web of Science.",
  "foot.method": "Méthode : comptages par regroupement côté API (group_by), comptage entier par pays (une publication compte pour chacun des pays de ses auteurs)."
},

  "about.toc": "Contents",
  "about.body": "<section id=\"ab-start\"><h3>Get started in three steps</h3><ol><li>Pick a tab: <b>Live search</b> (OpenAlex publications), <b>Patents</b> or <b>Import and merge</b> (your Web of Science, Scopus or Publish or Perish exports).</li><li>Enter your criteria: a topic, one or more countries, a period, then <b>Analyze</b>.</li><li>Read the indicators, map, ranking and networks; copy tables as CSV for your reports.</li></ol></section>"
   + "<section id=\"ab-live\"><h3>Live search</h3><p>Publications come from <b>OpenAlex</b>, an open database of more than 300 million documents. The topic is searched in titles and abstracts; leave it empty to analyze a country's whole output.</p><ul><li><b>Countries</b>: add one or more. A single country shows its <b>world rank</b> and share of world output; the map panel switches between the world ranking and <b>partner countries</b> (co-publications).</li><li><b>Compare with</b>: a second topic or country, drawn on the annual chart.</li><li><b>Map</b>: click a country (or a ranking row) to open its profile.</li><li><b>Auto refresh</b>: reruns the analysis every 5, 15 or 60 minutes.</li></ul></section>"
   + "<section id=\"ab-pat\"><h3>Patents</h3><p>Filter by keywords, by <b>CPC</b> or <b>IPC</b> code (for example <code>H10K</code> or <code>Y02E10/549</code>, several codes separated by commas), by <b>applicant</b> and by <b>jurisdiction</b> (publishing office: Morocco, European Patent Office, WIPO…). Data comes live from the EPO; without a keyword, the tab shows all patents published in the most recent year, and the world map fills in progressively because the EPO limits searches per minute. Applicants, their countries, classification and networks are computed on the records of the first 100 families returned by the EPO. The <b>View sample</b> button shows a real Espacenet export (100 families on seawater desalination). EPO counts are <b>publications</b> (an invention published in five offices counts five times); the Espacenet sample is counted in <b>families</b>. The EPO does not provide legal status in aggregate form, so it is not shown.</p><ul><li><b>Priority country</b>: country of first filing, which shows where the invention comes from.</li><li><b>Protection countries</b>: offices where the patent family is published.</li><li><b>Publishing office</b>: office that published each document.</li><li><b>Classification</b>: grouped by subclass (H10K), group (H10K30) or subgroup (H10K30/50); click a bar to filter.</li></ul></section>"
   + "<section id=\"ab-wb\"><h3>World Bank</h3><p>The <b>World Bank</b> tab queries the free World Bank API (World Development Indicators) live. Choose an indicator (R&amp;D spending, researchers, patents, scientific articles, high-technology exports, GDP, education, energy, water…) or enter any World Bank code, then the countries to compare and the period. The tab shows the trend by country with the world value as a dotted line, a map and a world ranking based on each country's latest available value, and the official definition of the indicator. Data can be downloaded as CSV.</p></section>"
   + "<section id=\"ab-import\"><h3>Import and merge</h3><p>Drop one or more exports; the site recognizes each file's database. Duplicates are matched by DOI, then by title, year and first author, then by title and year when a record has no DOI. Titles that are only similar are listed for review, never merged automatically. The merged corpus can be downloaded as CSV. <b>Your files never leave your browser.</b></p><ul><li><b>Web of Science</b>: Export → “Tab delimited file”, record content “Full Record”.</li><li><b>Scopus</b>: select all, Export → CSV with citation, bibliographical, abstract and keyword information.</li><li><b>Publish or Perish</b>: save the results as CSV (Google Scholar, Crossref, OpenAlex…).</li></ul></section>"
   + "<section id=\"ab-net\"><h3>Reading the networks</h3><p>The networks follow VOSviewer's principles. Each <b>node</b> is a keyword, country, author, institution, code or applicant; its size reflects the number of documents. A <b>link</b> joins two items that appear in the same documents; its width reflects the number of shared documents. <b>Colors</b> show either clusters of closely linked items (Louvain method) or the <b>average year</b> of the documents, to spot emerging topics.</p></section>"
   + "<section id=\"ab-ind\"><h3>Indicator definitions</h3><dl><dt>h-index</dt><dd>h publications each cited at least h times.</dd><dt>g-index</dt><dd>the g most cited publications total at least g² citations.</dd><dt>m-quotient</dt><dd>h-index divided by the number of years since the first publication.</dd><dt>Full counting</dt><dd>a publication counts once for each of its authors' countries, so country totals exceed the overall total.</dd><dt>World share</dt><dd>the country's publications divided by world publications with a known country.</dd><dt>Open access</dt><dd>gold (open journal), hybrid (open article in a subscription journal), green (repository copy), bronze (free to read without a license), diamond (no reading or publishing fees).</dd><dt>Patent family</dt><dd>all publications of the same invention across patent offices.</dd></dl></section>"
   + "<section id=\"ab-src\"><h3>Sources and limits</h3><ul><li><b>OpenAlex</b> (CC0 license): broad coverage, but affiliations and countries are sometimes missing; a free key raises the request volume.</li><li><b>Patents</b>: EPO Open Patent Services (free once the account is approved) and Lens.org, under their terms of use. Only aggregated counts are shown.</li><li><b>Scopus and Web of Science</b>: no open API; their data comes in through your exports, analyzed locally.</li></ul></section>",
  "about.author": "Created by", "about.contact": "Contact",
  "foot.data": "Bibliographic data: <a href=\"https://openalex.org\" target=\"_blank\" rel=\"noopener\">OpenAlex</a> (CC0 license). Patents: <a href=\"https://www.epo.org/en/searching-for-patents/data/web-services/ops\" target=\"_blank\" rel=\"noopener\">EPO Open Patent Services</a> and <a href=\"https://www.lens.org\" target=\"_blank\" rel=\"noopener\">The Lens</a>, under their terms of use. Imports: <a href=\"https://harzing.com/resources/publish-or-perish\" target=\"_blank\" rel=\"noopener\">Publish or Perish</a>, Scopus, Web of Science.",

        series: keys.map((k, i) => ({ name: k === "WLD" ? t("w.world") : cname(k), type: "line", connectNulls: true, symbolSize: 5, showSymbol: yv.length < 30,
          data: yv.map(y => byC.get(k).has(y) ? byC.get(k).get(y) : null),
          ...(k === "WLD" ? { lineStyle: { type: "dashed", width: 1.5, color: th.muted }, itemStyle: { color: th.muted } } : { lineStyle: { width: 2.2 }, itemStyle: { color: pal[i % pal.length] } }) }))
      });
    } catch (e) {
      el.querySelector(".wbc-chart").innerHTML = `<div class="na">${esc(e.bad ? t("wst.badCode", { code }) : t("wst.err", { msg: e.message }))}</div>`;
    }
  }
}
window.addEventListener("resize", () => WBC.forEach(c => c.resize()));
function renderCustom(id) {
  const tab = CUSTOM.find(x => x.id === id); if (!tab) return;
  renderFileInto($("customBody"), pickLang(tab.file), () => MODE === "custom:" + id);
}
function drawCustomTabs() {
  document.querySelectorAll("#tabs [data-custom]").forEach(b => { const tab = CUSTOM.find(x => x.id === b.dataset.custom); if (tab) b.textContent = pickLang(tab.title) || tab.id; });
}
async function loadSite() {
  let r;
  try { r = await fetch("site.json", { cache: "no-store" }); } catch { return; }   // preview or local file: nothing to load
  if (!r.ok) return;
  let j;
  try { j = JSON.parse(await r.text()); }
  catch (e) { $("siteBanner").innerHTML = t("site.err", { msg: esc(e.message) }); $("siteBanner").hidden = false; return; }
  SITE = j;
  if (j.colors || j.darkColors) applyColors(j.colors, j.darkColors);
  if (j.about) SITE_CONFIG.about = { ...(SITE_CONFIG.about || {}), ...j.about };
  if (typeof j.siteName === "string" && j.siteName.trim()) { SITE_CONFIG.siteName = j.siteName.trim(); SITE_CONFIG.siteNameAccent = typeof j.siteNameAccent === "string" ? j.siteNameAccent : ""; }
  else if (typeof j.siteNameAccent === "string") SITE_CONFIG.siteNameAccent = j.siteNameAccent;
  if (j.texts) ["fr", "en"].forEach(l => Object.assign(I18N[l], (j.texts && j.texts[l]) || {}));
  (j.hideTabs || []).forEach(name => { const b = $(BUILTIN_TABS[name]); if (b) b.hidden = true; });
  const aboutBtn = $("tabAbout");
  (j.tabs || []).forEach(tab => {
    if (!tab || !tab.id || !tab.file) return;
    const id = String(tab.id).toLowerCase().replace(/[^a-z0-9-]/g, "-");
    if (CUSTOM.some(x => x.id === id) || ["about", "worldbank", "settings", "sidebar", "customize", "upgrade", "downloads"].includes(id)) return;
    CUSTOM.push({ id, title: tab.title || id, file: tab.file });
    const b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", "false"); b.dataset.custom = id;
    b.addEventListener("click", () => setMode("custom:" + id));
    if (tab.after === "about" || !aboutBtn) $("tabs").appendChild(b); else $("tabs").insertBefore(b, aboutBtn);
  });
  applyStatic();
  const wantLang = j.defaultLang;
  if ((wantLang === "fr" || wantLang === "en") && !store.get("lang", "") && wantLang !== LANG) setLang(wantLang);
  const h = location.hash.slice(1);
  if (h && CUSTOM.some(x => x.id === h)) setMode("custom:" + h);
  else if (MODE === "about") renderAbout();
  else {
    const cur = { live: "tabLive", pat: "tabPat", wb: "tabWb", file: "tabFile" }[MODE];
    if (cur && $(cur).hidden) {
      const first = [...document.querySelectorAll("#tabs button")].find(x => !x.hidden);
      if (first) first.click();
    } else if (MODE === "live" && j.texts) run();
  }
}
$("file").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles([...e.dataTransfer.files]));

/* ---------- site colors (site.json "colors" and "darkColors") ---------- */
const COLOR_KEYS = ["main", "second", "third", "background", "panels", "text"];
const COLOR_DEFAULT = { main: "#1C6E8C", second: "#B4741C", third: "#2F7D5B", background: "#F2F5F6", panels: "#FFFFFF", text: "#13222B" };
const DARK_DEFAULT = { background: "#0D161B", panels: "#14212A", text: "#E2EBEE" };
const isHex = v => typeof v === "string" && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v.trim());
const hex6 = v => { v = v.trim(); return (v.length === 4 ? "#" + [...v.slice(1)].map(x => x + x).join("") : v).toUpperCase(); };
const rgbOf = h => [1, 3, 5].map(i => parseInt(hex6(h).slice(i, i + 2), 16));
/* mix(a, b, w): w = share of color b (0..1) */
const mix = (a, b, w) => "#" + rgbOf(a).map((x, i) => Math.round(x * (1 - w) + rgbOf(b)[i] * w).toString(16).padStart(2, "0")).join("").toUpperCase();
const pickColors = (o, base) => { const r = { ...base }; Object.keys(o || {}).forEach(k => { if (COLOR_KEYS.includes(k) && isHex(o[k])) r[k] = hex6(o[k]); }); return r; };
function colorVars(c, dark) {
  const v = dark
    ? { paper: c.background, surface: c.panels, ink: c.text, muted: mix(c.text, c.background, .4), line: mix(c.text, c.background, .85),
        accent: c.main, "accent-2": mix(c.main, "#FFFFFF", .4), "accent-soft": mix(c.main, c.panels, .75), ochre: c.second, "ochre-soft": mix(c.second, c.panels, .75),
        wb: c.third, "wb-soft": mix(c.third, c.panels, .75) }
    : { paper: c.background, surface: c.panels, ink: c.text, muted: mix(c.text, c.background, .45), line: mix(c.text, c.background, .85),
        accent: c.main, "accent-2": mix(c.main, "#000000", .35), "accent-soft": mix(c.main, "#FFFFFF", .82), ochre: c.second, "ochre-soft": mix(c.second, "#FFFFFF", .75),
        wb: c.third, "wb-soft": mix(c.third, "#FFFFFF", .8) };
  return Object.entries(v).map(([k, x]) => `--${k}:${x}`).join(";");
}
function applyColors(light, dark) {
  const L = pickColors(light, COLOR_DEFAULT);
  const D = pickColors(dark, { ...DARK_DEFAULT, main: mix(L.main, "#FFFFFF", .35), second: mix(L.second, "#FFFFFF", .25), third: mix(L.third, "#FFFFFF", .3) });
  let el = $("siteColors");
  if (!el) { el = document.createElement("style"); el.id = "siteColors"; document.head.appendChild(el); }
  const dv = colorVars(D, true);
  el.textContent = `:root{${colorVars(L, false)}}\n@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dv};color-scheme:dark}}\n:root[data-theme="dark"]{${dv};color-scheme:dark}`;
  try { rerender(); } catch {}
  return L;
}

/* ---------- CSV copy ---------- */
function csv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",;\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"); }
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
  const k = b.dataset.copy;
  if (k === "pcountries" ? !PDATA : !DATA) return;
  const text = k === "pcountries"
    ? csv([["rank", "code", PVIEW, "patents", "share"], ...LAST_PROWS.map(([c, n, d], i) => [i + 1, c, officeName(c), n, (n / d).toFixed(4)])])
    : k === "countries"
    ? csv([["rank", "code", "country", "publications", "share"], ...LAST_ROWS.map(([c, n, d], i) => [i + 1, c, cname(c), n, (n / d).toFixed(4)])])
    : csv([["rank", "title", "year", "citations", "doi", "source", "databases"], ...DATA.works.map((w, i) => [i + 1, w.title, w.year, w.cites, w.doi || "", w.source, w.bases ? w.bases.join(" + ") : ""])]);
  const old = b.textContent;
  try { await navigator.clipboard.writeText(text); b.textContent = t("m.copied"); } catch { b.textContent = t("m.copyFail"); }
  setTimeout(() => b.textContent = old, 1600);
}));

/* ---------- settings ---------- */
$("oaKey").value = cfg.key; $("workerUrl").value = store.get("worker") || SITE_CONFIG.workerUrl; $("viaWorker").checked = cfg.viaWorker;
$("btnSettings").addEventListener("click", () => { const el = $("settings"); el.hidden = !el.hidden; $("btnSettings").setAttribute("aria-expanded", String(!el.hidden)); });
$("saveSettings").addEventListener("click", () => {
  store.set("oaKey", $("oaKey").value.trim()); store.set("worker", $("workerUrl").value.trim()); store.set("viaWorker", $("viaWorker").checked ? "1" : "0");
  CACHE.clear(); $("settingsMsg").textContent = t("set.saved");
  if (MODE === "live") run(); else if (MODE === "pat") runPat();
});
$("testWorker").addEventListener("click", async () => {
  const w = $("workerUrl").value.trim().replace(/\/+$/, "");
  if (!w) { $("settingsMsg").textContent = t("set.needUrl"); return; }
  $("settingsMsg").textContent = t("set.testing");
  try {
    const r = await fetch(w + "/health"); const j = await r.json();
    $("settingsMsg").textContent = t("set.ok", { epo: j.epo ? t("set.yes") : t("set.no"), lens: j.lens ? t("set.yes") : t("set.no"), oa: j.openalex ? t("set.keyYes") : t("set.keyNo") });
  } catch { $("settingsMsg").textContent = t("set.ko"); }
});

/* ---------- auto refresh ---------- */
$("auto").value = store.get("auto", "0");
function setAuto() {
  clearInterval(timer); const m = Number($("auto").value); store.set("auto", String(m));
  if (m > 0) timer = setInterval(() => { if (document.hidden) return; if (MODE === "live") run(true); else if (MODE === "pat") runPat(); }, m * 60000);
}
$("auto").addEventListener("change", setAuto);

/* ---------- language ---------- */
function setLang(l) {
  if (l === LANG) return;
  LANG = l; store.set("lang", l); nf = new Intl.NumberFormat(LOC());
  applyStatic(); fillDatalists(); fillWbIndicators(); pubChips.draw(); patChips.draw(); wbChips.draw();
  if ($("c2").value.trim()) { const c = resolveCountryInput($("c2").value); if (c) $("c2").value = cname(c); }
  if (MODE === "live") run();
  else if (MODE === "pat") runPat();
  else if (MODE === "wb") runWb();
  else if (MODE === "about") renderAbout();
  else if (MODE.startsWith("custom:")) renderCustom(MODE.slice(7));
  else if (FILES.length) refreshFiles();
  else setStatus("", t("st.chooseFile"));
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- theme ---------- */
const rerender = () => { Object.values(charts).forEach(c => c.clear()); renderAll(); if (PDATA) renderPat(); if (WDATA) renderWb(); if (WBC.length && MODE.startsWith("custom:")) renderWbBlocks($("customBody"), () => MODE.startsWith("custom:")); };
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", rerender); } catch {}
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- startup ---------- */
applyStatic(); fillDatalists();
let restored = false;
try {
  const last = JSON.parse(store.get("last", "null"));
  if (last && typeof last === "object") {
    restored = true;
    $("q").value = last.q || ""; $("q2").value = last.q2 || ""; $("y1").value = last.y1 || 2005; $("type").value = last.type || ""; $("oaOnly").checked = !!last.oa;
    SELECTED = Array.isArray(last.countries) ? last.countries.filter(c => ISO.includes(c)) : [];
    $("c2").value = last.c2 ? cname(last.c2) : "";
  }
} catch {}
if (!restored) { $("q").value = ""; SELECTED = ["CA"]; $("c2").value = cname("FR"); }
try {
  const pl = JSON.parse(store.get("plast", "null"));
  if (pl && typeof pl === "object") { $("pq").value = pl.q || ""; $("pap").value = pl.applicant || ""; $("pcls").value = (pl.codes || []).join(", "); $("pclsType").value = pl.clsType === "ipc" ? "ipc" : "cpc"; $("py1").value = pl.y1 || 2005; PSEL = (pl.countries || []).filter(c => ISO.includes(c)); }
  else $("pq").value = "";
} catch {}
try {
  const wl = JSON.parse(store.get("wlast", "null"));
  if (wl && typeof wl === "object") {
    if (Array.isArray(wl.countries)) WSEL = wl.countries.filter(c => ISO.includes(c));
    if (wl.y1) $("wy1").value = wl.y1;
    if (wl.code) { fillWbIndicators(); if (WB_IND.some(r => r[1] === wl.code)) $("wind").value = wl.code; else { $("wind").value = "_other"; $("wcode").value = wl.code; } }
  }
} catch {}
fillWbIndicators(); $("wy2").value = CUR_YEAR;
pubChips.draw(); patChips.draw(); wbChips.draw();
$("qform").addEventListener("submit", e => { e.preventDefault(); run(); });
setAuto();
if (location.hash === "#about") setMode("about"); else if (location.hash === "#worldbank") setMode("wb"); else run();
loadSite();
})();
